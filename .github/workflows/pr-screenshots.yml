name: PR screenshots

# Captures Playwright screenshots of the app (with mocked ESPN data) and posts
# them as a comment on the pull request. Images are stored on the orphan
# `pr-screenshots` branch so they can be embedded inline in the comment.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # Only UI component changes need new screenshots.
    paths:
      - "src/components/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One writer at a time to the shared pr-screenshots branch.
  group: pr-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    # Fork PRs get a read-only token and cannot publish images.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots

      - name: Publish images to the pr-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="pr-${PR_NUMBER}/${HEAD_SHA}"
          mkdir "$RUNNER_TEMP/shots" && cd "$RUNNER_TEMP/shots"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin pr-screenshots; then
            git checkout -q -b pr-screenshots FETCH_HEAD
          else
            git checkout -q --orphan pr-screenshots
          fi
          mkdir -p "$dir"
          cp "$GITHUB_WORKSPACE"/screenshots/*.png "$dir"/
          git add "$dir"
          git commit -qm "Screenshots for PR #${PR_NUMBER} at ${HEAD_SHA}"
          git push -q origin pr-screenshots

      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const pr = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA;
            const marker = "<!-- pr-screenshots -->";
            // PNG width and height live in the IHDR chunk at bytes 16-23.
            const shots = fs
              .readdirSync("screenshots")
              .filter((file) => file.endsWith(".png"))
              .map((file) => {
                const png = fs.readFileSync(`screenshots/${file}`);
                return {
                  file,
                  width: png.readUInt32BE(16),
                  height: png.readUInt32BE(20),
                };
              })
              .sort((a, b) => b.width - a.width || a.file.localeCompare(b.file));
            const url = (file) =>
              `https://github.com/${owner}/${repo}/blob/pr-screenshots/pr-${pr}/${sha}/${file}?raw=true`;
            // Shown at the captured size; GitHub only scales down images
            // wider than the comment column.
            const images = shots
              .map(
                ({ file, width, height }) =>
                  `<details open><summary>${file.replace(".png", "")} (${width}×${height})</summary>\n\n<img src="${url(file)}" width="${width}" alt="${file}">\n\n</details>`,
              )
              .join("\n");
            const body = `${marker}\n### Screenshots\n\nCaptured at ${sha.slice(0, 7)} with mocked ESPN data, one screen per viewport at 1x scale.\n\n${images}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body,
              });
            }
